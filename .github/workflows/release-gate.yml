name: Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm run ii

      - name: Install Playwright browsers
        run: corepack pnpm run test:e2e:install-browsers

      - name: Run release gate
        run: corepack pnpm run check:deploy
