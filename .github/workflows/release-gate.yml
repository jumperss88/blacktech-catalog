name: Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: corepack pnpm run test:e2e:install-browsers

      - name: Run release gate
        run: corepack pnpm run check:deploy
